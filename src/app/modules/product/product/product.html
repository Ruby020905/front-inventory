<mat-card>

    <h2 class="alinear">Listados de productos</h2>
    <mat-card-content>
    <mat-card-header>
        <div>
            <mat-form-field hintLabel="Buscar Productos" appearance="fill">
                <mat-label>Buscar Productos</mat-label>
                <input matInput #input (keyup)="buscar(input.value)">

            </mat-form-field>
        </div>
    </mat-card-header>
    <mat-card-header>
        <div class="right">
            <ul>
                <li>
                    <button mat-raised-button color="primary" (click)="openProductDialag()">Agregar Productos</button>
                </li>
            </ul>
        </div>
    </mat-card-header>

    <div mat-card-image></div> 

    <table mat-table [dataSource]="dataSource" class="mat-cell">
<!-- id colum -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> N° </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
<ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef> Tipo de Medicamento </th>
    <td mat-cell *matCellDef="let element"> {{ element.category?.name }} </td>
</ng-container>
    <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Presentacion </th>
        <td mat-cell *matCellDef="let element"> {{element.type}} </td>
    </ng-container>
     <ng-container matColumnDef="account">
        <th mat-header-cell *matHeaderCellDef> Unidad </th>
        <td mat-cell *matCellDef="let element"> {{element.account}} </td>
    </ng-container>
    <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef> Cantidad </th>
            <td mat-cell *matCellDef="let element"> {{element.stock}} </td>
    </ng-container>
    <ng-container matColumnDef="picture">
            <th mat-header-cell *matHeaderCellDef> Imagen </th>
            <td mat-cell *matCellDef="let element"> <img [src]="element.picture" alt="Imagen del producto" width="100" height="100"> </td>
    </ng-container>     
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Fecha </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>     


    <!-- ACTIONS -->
       <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element; let i=index;">
        <button  mat-icon-button color="accent" (click)="edit(element.id, element.name, element.category, element.date, element.type, element.account, element.stock, element.picture)" >
            <mat-icon arial-label="Edit">edit</mat-icon>
        </button>
         <button *ngIf="isAdmin" mat-icon-button color="accent"  (click)="delete(element.id)" > 
            <mat-icon arial-label="Delete">delete</mat-icon>
        </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</mat-card-content>
</mat-card>
